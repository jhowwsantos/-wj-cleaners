<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </radialGradient>

    <!-- Main Blue Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="45%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Light Blue Accent Gradient -->
    <linearGradient id="lightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Bottom Dark Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#1e40af" />
      <stop offset="80%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base (App Icon Squircle) -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="4" />

  <!-- Background Subtle Grid Pattern / Gloss Rim -->
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />

  <!-- Outer Swirling Blue Arch Ring -->
  <path d="M 60 270 C 40 160 140 70 260 70 C 370 70 450 140 460 230" fill="none" stroke="url(#textGrad)" stroke-width="18" stroke-linecap="round" filter="url(#dropShadow)" />

  <!-- Roof & Chimney Header -->
  <g transform="translate(0, 0)">
    <!-- Main Roof Peak -->
    <path d="M 125 135 L 256 55 L 387 135 L 365 135 L 256 68 L 147 135 Z" fill="url(#textGrad)" filter="url(#dropShadow)" />
    
    <!-- Chimney on Right -->
    <rect x="340" y="80" width="18" height="32" rx="2" fill="url(#textGrad)" />

    <!-- 4-Pane Window Icon -->
    <g transform="translate(239, 98)" fill="url(#textGrad)">
      <rect x="0" y="0" width="15" height="15" rx="2" />
      <rect x="19" y="0" width="15" height="15" rx="2" />
      <rect x="0" y="19" width="15" height="15" rx="2" />
      <rect x="19" y="19" width="15" height="15" rx="2" />
    </g>
  </g>

  <!-- Sparkle Stars (Top Right) -->
  <!-- Star 1 -->
  <path d="M 355 58 Q 355 70 367 70 Q 355 70 355 82 Q 355 70 343 70 Q 355 70 355 58 Z" fill="#38bdf8" />
  <!-- Star 2 -->
  <path d="M 412 95 Q 412 110 427 110 Q 412 110 412 125 Q 412 110 397 110 Q 412 110 412 95 Z" fill="#60a5fa" />

  <!-- Central "W & J" Branding Text Elements -->
  <g filter="url(#dropShadow)">
    <!-- "W" -->
    <text x="88" y="305" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="175" fill="url(#textGrad)" letter-spacing="-4">W</text>
    
    <!-- "&" -->
    <text x="272" y="275" font-family="'Georgia', 'Times New Roman', serif" font-weight="700" font-size="115" fill="url(#textGrad)">&amp;</text>
    
    <!-- "J" -->
    <text x="360" y="315" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="185" fill="url(#textGrad)">J</text>
  </g>

  <!-- Dynamic Sweeping Blue Bottom Swoosh Container -->
  <path d="M 0 250 C 70 210 170 195 270 205 C 370 215 450 260 512 300 L 512 416 C 512 469 469 512 416 512 L 96 512 C 43 512 0 469 0 416 Z" fill="url(#swooshGrad)" filter="url(#dropShadow)" />

  <!-- Broom Sweeping Effect on Right -->
  <g transform="translate(20, -10)">
    <!-- Broom Handle Stick -->
    <path d="M 428 200 L 388 335" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" filter="url(#dropShadow)" />
    <!-- Broom Bristles / Flare -->
    <path d="M 388 330 C 350 365 285 390 220 395 C 290 390 360 370 405 342 Z" fill="#ffffff" filter="url(#glow)" />
    <path d="M 390 332 C 360 360 300 382 240 388 C 295 382 355 365 398 344 Z" fill="#e0f2fe" />
  </g>

  <!-- Sparkles on Right Side (Near Broom) -->
  <path d="M 458 275 Q 458 290 473 290 Q 458 290 458 305 Q 458 290 443 290 Q 458 290 458 275 Z" fill="#ffffff" />
  <path d="M 448 318 Q 448 326 456 326 Q 448 326 448 334 Q 448 326 440 326 Q 448 326 448 318 Z" fill="#93c5fd" />

  <!-- "CLEANERS" Main Label -->
  <text x="256" y="426" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="8" filter="url(#dropShadow)">CLEANERS</text>

  <!-- Divider Sparkle Star -->
  <path d="M 256 442 Q 256 447 261 447 Q 256 447 256 452 Q 256 447 251 447 Q 256 447 256 442 Z" fill="#38bdf8" />

  <!-- "CLEAN SPACES, BETTER PLACES" Subtitle -->
  <text x="256" y="468" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="15" fill="#e0f2fe" letter-spacing="4">CLEAN SPACES, BETTER PLACES</text>
</svg>
