<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Rich Deep Royal Blue Full-Bleed Background Gradient (Edge-to-Edge 100%) -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0738bc" />
      <stop offset="50%" stop-color="#02248a" />
      <stop offset="85%" stop-color="#01175b" />
      <stop offset="100%" stop-color="#000f40" />
    </radialGradient>

    <!-- White / Silver Metallic Gradient for Inside House Area -->
    <linearGradient id="houseInteriorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Deep Blue Metallic Gradient for "W" and "J" -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081e42" />
      <stop offset="35%" stop-color="#1e3a8a" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Electric Royal Blue Gradient for Roof and Left Arc -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Dark Navy Bottom Swoosh Gradient -->
    <linearGradient id="bottomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="25%" stop-color="#0f2b73" />
      <stop offset="70%" stop-color="#08153b" />
      <stop offset="100%" stop-color="#02081a" />
    </linearGradient>

    <!-- Soft Drop Shadows for 3D Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00081d" flood-opacity="0.5" />
    </filter>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000924" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Full Square Background (100% Full-Bleed 1024x1024 Edge-to-Edge Dark Royal Blue) -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- 2. Central White House Interior Oval/Shield (White House Interior as in Official Logo) -->
  <g filter="url(#dropShadow)">
    <path d="M 512 80 L 840 270 C 840 270 820 660 512 730 C 204 660 184 270 184 270 Z" fill="url(#houseInteriorGrad)" />
  </g>

  <!-- 3. Top House Roof Structure & Chimney -->
  <g filter="url(#dropShadow)">
    <!-- Chimney -->
    <rect x="710" y="150" width="48" height="85" rx="4" fill="url(#roofGrad)" />

    <!-- Main Outer Roof -->
    <path d="M 160 280 L 512 80 L 864 280 L 814 280 L 512 115 L 210 280 Z" fill="url(#roofGrad)" />

    <!-- Window Grid (4 Blue Panes inside House Top) -->
    <g transform="translate(466, 195)">
      <rect x="0" y="0" width="38" height="38" rx="4" fill="#0f2b73" />
      <rect x="50" y="0" width="38" height="38" rx="4" fill="#0f2b73" />
      <rect x="0" y="50" width="38" height="38" rx="4" fill="#0f2b73" />
      <rect x="50" y="50" width="38" height="38" rx="4" fill="#0f2b73" />
    </g>

    <!-- Sparkle Stars (Top Right) -->
    <path d="M 725 100 Q 725 125 750 125 Q 725 125 725 150 Q 725 125 700 125 Q 725 125 725 100 Z" fill="#ffffff" />
    <path d="M 830 190 Q 830 210 850 210 Q 830 210 830 230 Q 830 210 810 210 Q 830 210 830 190 Z" fill="#38bdf8" />
  </g>

  <!-- 4. Sweeping Left Arc Ribbon -->
  <path d="M 140 280 C -10 400 -10 610 130 725 C 270 840 520 820 740 690 C 630 760 380 805 220 760 C 80 715 50 515 140 350 Z" fill="url(#roofGrad)" filter="url(#dropShadow)" opacity="0.95" />

  <!-- 5. Central "W & J" Branding Typography -->
  <g filter="url(#textShadow)">
    <!-- "W" -->
    <text x="160" y="615" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="370" fill="url(#textGrad)" letter-spacing="-10">W</text>
    <text x="160" y="610" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="370" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9" letter-spacing="-10">W</text>

    <!-- "&" -->
    <text x="515" y="520" font-family="'Georgia', 'Times New Roman', serif" font-weight="700" font-size="230" fill="url(#textGrad)">&amp;</text>
    <text x="515" y="515" font-family="'Georgia', 'Times New Roman', serif" font-weight="700" font-size="230" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9">&amp;</text>

    <!-- "J" -->
    <text x="680" y="635" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="400" fill="url(#textGrad)">J</text>
    <text x="680" y="630" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="400" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9">J</text>
  </g>

  <!-- 6. Broom Element Sweeping Right -->
  <g filter="url(#dropShadow)">
    <!-- Handle Pole -->
    <line x1="900" y1="400" x2="825" y2="650" stroke="#0284c7" stroke-width="18" stroke-linecap="round" />
    <line x1="900" y1="400" x2="825" y2="650" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    
    <!-- Broom Connector Cap -->
    <path d="M 780 630 Q 845 620 865 668 Z" fill="#0f2b73" />

    <!-- White Bristles -->
    <path d="M 790 640 C 720 672 610 735 580 768 C 645 778 805 755 865 678 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
    <path d="M 780 650 C 720 682 630 740 600 768" stroke="#0284c7" stroke-width="4" fill="none" opacity="0.7" />
    <path d="M 800 660 C 750 692 670 745 640 772" stroke="#0284c7" stroke-width="4" fill="none" opacity="0.7" />

    <!-- Sparkles on Broom -->
    <path d="M 925 550 Q 925 570 945 570 Q 925 570 925 590 Q 925 570 905 570 Q 925 570 925 550 Z" fill="#ffffff" />
    <path d="M 885 640 Q 885 652 897 652 Q 885 652 885 664 Q 885 652 873 652 Q 885 652 885 640 Z" fill="#38bdf8" />
  </g>

  <!-- 7. Bottom Swoosh Container & Dark Navy Banner -->
  <path d="M 0 670 C 180 605 400 585 620 615 C 780 635 920 685 1024 735 L 1024 1024 L 0 1024 Z" fill="url(#bottomGrad)" filter="url(#dropShadow)" />
  <path d="M 0 670 C 180 605 400 585 620 615 C 780 635 920 685 1024 735" fill="none" stroke="#38bdf8" stroke-width="7" opacity="0.85" />

  <!-- 8. Bottom Branding Text -->
  <g filter="url(#dropShadow)">
    <!-- "CLEANERS" Main Uppercase Text -->
    <text x="512" y="835" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="96" fill="#ffffff" text-anchor="middle" letter-spacing="24">CLEANERS</text>

    <!-- Horizontal Divider Line with Center Diamond Star -->
    <line x1="140" y1="878" x2="465" y2="878" stroke="#38bdf8" stroke-width="3" opacity="0.85" />
    <polygon points="512,865 522,878 512,891 502,878" fill="#ffffff" />
    <line x1="559" y1="878" x2="884" y2="878" stroke="#38bdf8" stroke-width="3" opacity="0.85" />

    <!-- "CLEAN SPACES, BETTER PLACES" Subtitle -->
    <text x="512" y="938" font-family="'Arial', 'Helvetica', sans-serif" font-weight="700" font-size="32" fill="#f8fafc" text-anchor="middle" letter-spacing="8">CLEAN SPACES, BETTER PLACES</text>
  </g>
</svg>
