<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Treino Premium</title>
<link rel="icon" type="image/png" sizes="180x180" href="/icon.svg?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="/icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="Treino Premium">
<style>
:root{color-scheme:dark;--bg:#0a0a0c;--panel:#121214;--panel2:#1a1a1c;--line:#2a2a2c;--gold:#eab308;--text:#f4f4f5;--muted:#9ca3af}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{max-width:560px;min-height:100vh;margin:auto;padding-bottom:28px}
header{position:sticky;top:0;z-index:10;background:#0a0a0cf2;backdrop-filter:blur(14px);border-bottom:1px solid #222}
.timerlabel{text-align:center;color:#eab308cc;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding-top:18px}.timerrow{display:flex;align-items:center;justify-content:center;gap:20px;padding:8px 16px 18px}.timer{font:600 46px ui-monospace,SFMono-Regular,monospace;letter-spacing:5px;color:#6b7280}.timer.active{color:var(--gold);text-shadow:0 0 12px #eab30866}.round{width:48px;height:48px;border-radius:50%;border:1px solid #333;background:var(--panel2);color:var(--muted);font-size:24px}
.progress{padding:8px 20px 20px}.progressline{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.track{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--gold);transition:width .2s}
main{padding:22px 20px}.dayheading{font-size:12px;font-weight:800;color:#6b7280;margin:0 0 12px;letter-spacing:1.5px;text-transform:uppercase}.days{display:flex;gap:8px;margin-bottom:28px}.day{flex:1;padding:10px 2px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:800}.day.active{background:#eab30833;border-color:#eab30880;color:var(--gold)}
h1{font-size:19px;margin:0 0 6px;font-weight:900;letter-spacing:.3px;color:#fff}.subtitle{font-size:12px;color:#6b7280;line-height:1.6;margin:0 0 22px}.list{display:flex;flex-direction:column;gap:13px}.exercise{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);transition:background .2s,border-color .2s}.exercise.done{border-color:#eab30866;background:#141400}.top{display:flex;align-items:flex-start;gap:11px;margin-bottom:15px}.check{width:26px;height:26px;flex-shrink:0;accent-color:var(--gold);margin:2px 0 0}.info{flex:1;min-width:0}.name{margin:0;color:#fff;font-weight:800;font-size:15px;line-height:1.35}.done .name{color:var(--gold)}.meta{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.5}.rest{border:1px solid #333;border-radius:9px;background:var(--panel2);color:#d1d5db;padding:10px 11px;font-size:12px;font-weight:700;white-space:nowrap}.rest.active{color:#000;background:var(--gold);border-color:var(--gold)}.load{width:100%;border:1px solid var(--line);border-radius:9px;background:#0a0a0c;padding:13px;color:white;font-size:14px;outline:none}.load:focus{border-color:#eab30880}.load::placeholder{color:#6b7280}.footer{padding:28px 20px;text-align:center;color:#6b7280;font-size:12px;line-height:1.6}.clear{margin-top:14px;background:transparent;border:1px solid #333;border-radius:10px;padding:12px 16px;color:var(--muted)}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:370px){.timer{font-size:38px}.rest{padding:9px 7px;font-size:11px}.exercise{padding:12px}.meta{font-size:11px}}
</style>
</head>
<body><div class="app">
<header><div id="timerLabel" class="timerlabel">Cronômetro</div><div class="timerrow"><div id="timer" class="timer" aria-live="polite">00:00</div><button id="stop" class="round" aria-label="Parar descanso">×</button></div><div class="progress"><div class="progressline"><span>Progresso Hoje</span><span id="progressText">0 de 5</span></div><div class="track"><div id="progressFill" class="fill"></div></div></div></header>
<main><h2 class="dayheading">Escolha o Dia</h2><nav id="days" class="days" aria-label="Dias da semana"></nav><h1 id="title"></h1><p class="subtitle">Séries, repetições, carga e descanso de cada exercício.</p><section id="list" class="list"></section><div class="footer"><button id="clear" class="clear">Limpar progresso deste dia</button><p>TREINO PREMIUM · CONSISTÊNCIA TODOS OS DIAS</p></div></main>
</div>
<script>
(()=>{"use strict";
const plan={
SEG:{title:"SEGUNDA — PUSH A (Peito, Ombro, Tríceps)",list:[["seg1","Supino Reto","3 séries • 8-10 reps",120],["seg2","Supino Inclinado com Halteres","3 séries • 8-12 reps",90],["seg3","Elevação Lateral","4 séries • 12-15 reps",60],["seg4","Desenvolvimento Máquina","3 séries • 8-12 reps",90],["seg5","Tríceps na Polia","3 séries • 10-15 reps",60]]},
TER:{title:"TERÇA — PULL A (Costas, Bíceps)",list:[["ter1","Puxada Alta","3 séries • 8-12 reps",90],["ter2","Remada Curvada","3 séries • 8-12 reps",90],["ter3","Remada Sentada","3 séries • 10-12 reps",60],["ter4","Rosca Direta","3 séries • 8-12 reps",60],["ter5","Rosca Martelo","3 séries • 10-12 reps",60]]},
QUA:{title:"QUARTA — PERNA COMPLETA",list:[["qua1","Agachamento Livre","4 séries • 8-10 reps",120],["qua2","Leg Press 45º","3 séries • 10-12 reps",90],["qua3","Cadeira Extensora","3 séries • 12-15 reps",60],["qua4","Mesa Flexora","3 séries • 10-15 reps",60],["qua5","Panturrilha no Smith","4 séries • 15-20 reps",60]]},
QUI:{title:"QUINTA — PUSH B (Peito, Ombro, Tríceps)",list:[["qui1","Crucifixo Polia","3 séries • 10-15 reps",90],["qui2","Supino Máquina","3 séries • 8-12 reps",90],["qui3","Elevação Frontal","3 séries • 12-15 reps",60],["qui4","Elevação Lateral","3 séries • 12-15 reps",60],["qui5","Tríceps Testa","3 séries • 10-15 reps",60]]},
SEX:{title:"SEXTA — PULL B (Costas, Bíceps)",list:[["sex1","Barra Fixa ou Graviton","3 séries • Falha",120],["sex2","Remada Unilateral (Serrote)","3 séries • 8-12 reps",90],["sex3","Crucifixo Inverso","3 séries • 12-15 reps",60],["sex4","Rosca Alternada","3 séries • 10-12 reps",60],["sex5","Rosca Scott","3 séries • 10-12 reps",60]]}
};
const key="treinoPremiumData";let day="SEG",data={};try{data=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){data={}}
let timerInt=null,endAt=0;
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
function fmt(n){n=Math.max(0,n);return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function stop(){if(timerInt)clearInterval(timerInt);timerInt=null;endAt=0;$("timer").textContent="00:00";$("timer").classList.remove("active");$("timerLabel").textContent="Cronômetro"}
function rest(seconds){stop();endAt=Date.now()+seconds*1000;$("timerLabel").textContent="Descanso Ativo";$("timer").classList.add("active");const tick=()=>{let left=Math.max(0,Math.ceil((endAt-Date.now())/1000));$("timer").textContent=fmt(left);if(left<=0)stop()};tick();timerInt=setInterval(tick,250);window.scrollTo({top:0,behavior:"smooth"})}
function renderDays(){$("days").innerHTML=Object.keys(plan).map(d=>'<button class="day '+(d===day?"active":"")+'" data-day="'+d+'" aria-pressed="'+(d===day)+'">'+d+'</button>').join("")}
function render(){const w=plan[day];$("title").textContent=w.title;$("list").innerHTML=w.list.map(([id,name,sets,restSecs])=>{let v=data[day+"-"+id]||{};return '<article class="exercise '+(v.done?"done":"")+'"><div class="top"><input class="check" type="checkbox" data-check="'+id+'" '+(v.done?"checked":"")+' aria-label="Concluir '+name+'"><div class="info"><p class="name">'+name+'</p><div class="meta">'+sets+' · '+restSecs+'s descanso</div></div><button class="rest" data-rest="'+restSecs+'">Descanso</button></div><input class="load" type="text" data-load="'+id+'" value="'+esc(v.load||"")+'" placeholder="Carga / notas (ex.: 20 kg)" aria-label="Carga e notas para '+name+'"></article>'}).join("");updateProgress()}
function updateProgress(){let list=plan[day].list,done=list.filter(([id])=>data[day+"-"+id]?.done).length;$("progressText").textContent=done+" de "+list.length;$("progressFill").style.width=(100*done/list.length)+"%"}
$("days").addEventListener("click",e=>{let b=e.target.closest("[data-day]");if(!b)return;day=b.dataset.day;renderDays();render()});
$("list").addEventListener("change",e=>{let c=e.target.closest("[data-check]");if(!c)return;let k=day+"-"+c.dataset.check;data[k]={...(data[k]||{}),done:c.checked};save();c.closest(".exercise").classList.toggle("done",c.checked);updateProgress()});
$("list").addEventListener("input",e=>{let i=e.target.closest("[data-load]");if(!i)return;let k=day+"-"+i.dataset.load;data[k]={...(data[k]||{}),load:i.value};save()});
$("list").addEventListener("click",e=>{let b=e.target.closest("[data-rest]");if(b)rest(Number(b.dataset.rest)||60)});
$("stop").addEventListener("click",stop);
$("clear").addEventListener("click",()=>{if(!confirm("Limpar as marcações e cargas deste dia?"))return;plan[day].list.forEach(([id])=>delete data[day+"-"+id]);save();render()});
renderDays();render();
})();
</script></body></html>
